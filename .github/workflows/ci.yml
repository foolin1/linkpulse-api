name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  JWT_SIGNING_KEY: linkpulse-ci-only-signing-key-2026-secure-value
  POSTGRES_PASSWORD: linkpulse_ci_password

jobs:
  build-and-test:
    name: Build, test and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify Docker
        run: docker info

      - name: Restore dependencies
        run: dotnet restore LinkPulse.sln

      - name: Verify formatting
        run: >
          dotnet format LinkPulse.sln
          --verify-no-changes
          --no-restore

      - name: Build solution
        run: >
          dotnet build LinkPulse.sln
          --configuration Release
          --no-restore

      - name: Run tests
        run: >
          dotnet test LinkPulse.sln
          --configuration Release
          --no-build

      - name: Check vulnerable packages
        run: >
          dotnet list LinkPulse.sln package
          --vulnerable
          --include-transitive

      - name: Build Docker Compose services
        run: docker compose build migrations api

      - name: Start Docker Compose stack
        run: docker compose up -d

      - name: Wait for API health
        shell: bash
        run: |
          for attempt in {1..45}; do
            status="$(
              docker inspect \
                --format='{{.State.Health.Status}}' \
                linkpulse-api \
                2>/dev/null || true
            )"

            echo "Attempt ${attempt}: ${status}"

            if [ "${status}" = "healthy" ]; then
              curl --fail --silent \
                http://localhost:5080/health/ready
              exit 0
            fi

            sleep 2
          done

          docker compose ps -a
          exit 1

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Docker Compose stack
        if: always()
        run: >
          docker compose down
          --volumes
          --remove-orphans